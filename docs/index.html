<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="按课件顺序整理的毒理学笔记。从剂量、砷汞和铅读到食品安全与生殖毒理，附原PDF页码、自测和论文链接。">
  <meta name="color-scheme" content="light dark">
  <title>毒理学笔记</title>
  <link rel="stylesheet" href="style.css?v=notebook">
  <script src="content.js?v=notebook" defer></script>

<body data-page="home">
  <a class="skip-link" href="#main">跳到正文</a>
  <header class="masthead">
    <div class="masthead-inner">

      <a href="#overview" class="brand">毒理学笔记</a>
      <label class="search-box">

        <input id="search" type="search" placeholder="搜笔记，比如 铅 或 BPA" aria-label="搜索笔记" spellcheck="false" autocomplete="off">
        <kbd aria-hidden="true">/</kbd>

      <button id="theme-toggle" class="quiet-button" type="button" aria-label="切换深色模式">深色</button>
    </div>

  <div class="workspace">
    <button id="backdrop" class="backdrop" type="button" aria-label="关闭目录" hidden></button>

      <nav id="outline"></nav>
      <button class="quiet-button back-top" id="back-top" type="button">回到页首</button>
    </aside>

  <noscript><p>打开 JavaScript 即可使用目录和搜索。也可以直接读 GitHub 里的 <a href="https://github.com/hanson2017ear/toxicology-course-notes/tree/main/notes">Markdown 笔记</a>。</p></noscript>
