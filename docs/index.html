<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="color-scheme" content="light dark">
  <title>毒理学笔记</title>
  <link rel="stylesheet" href="style.css?v=field-edition-3">
  <script src="content.js?v=field-edition-3" defer></script>

</head>
<body data-page="home">
  <a class="skip-link" href="#main">跳到正文</a>
  <header class="masthead">
    <div class="masthead-inner">
      <a href="#overview" class="brand"><span class="book-mark" aria-hidden="true"><i></i></span>毒理学笔记</a>
      <nav class="top-navigation" aria-label="笔记导航">
        <button id="menu-toggle" class="quiet-button menu-toggle" type="button" aria-controls="sidebar" aria-expanded="false">目录</button>
        <a class="feature-link" href="#bpa-review">双酚 A 专题</a>
      </nav>
      <button type="button" class="search-toggle quiet-button" id="search-toggle" aria-expanded="false" aria-controls="search-box" aria-label="搜索笔记"><span class="search-icon" aria-hidden="true"></span></button>
      <label class="search-box" id="search-box">
        <span class="search-icon" aria-hidden="true"></span>
        <input id="search" type="search" placeholder="搜索章节、案例或术语" aria-label="搜索笔记" spellcheck="false" autocomplete="off">
        <kbd aria-hidden="true">/</kbd>
      </label>
      <button id="theme-toggle" class="quiet-button theme-toggle" type="button" aria-label="切换深色模式"><span class="theme-symbol" aria-hidden="true"></span><span class="theme-label">深色</span></button>
    </div>
  </header>
  <dialog id="sidebar" class="sidebar" aria-labelledby="menu-title">
      <div class="drawer-head"><h2 id="menu-title">目录</h2><button type="button" class="quiet-button" id="close-menu">关闭</button></div>
      <nav id="course-nav"></nav>
      <a class="sidebar-link" href="#about">来源与勘误</a>
  </dialog>
  <div class="workspace">
    <main id="main" tabindex="-1">
      <article id="article" class="article"></article>
      <nav id="chapter-pager" class="chapter-pager" aria-label="相邻章节" hidden></nav>
      <footer class="page-footer">
        <a href="#about">来源与勘误</a>
        <a id="repo-link" href="https://github.com/hanson2017ear/toxicology-course-notes">GitHub 仓库</a>
      </footer>
    </main>
    <aside id="outline-shell" class="page-outline" aria-label="本章小节" hidden>
      <p class="outline-title">本章小节</p>
      <nav id="outline"></nav>
      <button class="quiet-button back-top" id="back-top" type="button">回到页首</button>
    </aside>
  </div>
  <dialog id="figure-viewer" class="figure-viewer" aria-labelledby="figure-title">
    <div class="figure-toolbar"><h2 id="figure-title">双酚 A 机制图</h2><button type="button" class="quiet-button" id="zoom-figure" aria-pressed="false">放大</button><button type="button" class="quiet-button" id="close-figure" autofocus>关闭</button></div>
    <div class="figure-canvas" tabindex="0" role="region" aria-label="可滚动查看机制图"></div>
  </dialog>
  <noscript><p>打开 JavaScript 即可使用目录和搜索。也可以直接读 GitHub 里的 <a href="https://github.com/hanson2017ear/toxicology-course-notes/tree/main/notes">Markdown 笔记</a>。</p></noscript>
